<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .modal-backdrop {
            z-index: 1040 !important;
        }
        .modal {
            z-index: 1050 !important;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-person-badge"></i> Sistema de Empleados
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/empleados">Empleados</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-md-12">
                <h2><i class="bi bi-people-fill"></i> Gestión de Empleados</h2>
            </div>
        </div>

        <!-- Alertas -->
        <div id="alertContainer"></div>

        <!-- Barra de búsqueda y botones -->
        <div class="row mb-3">
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchInput" placeholder="Buscar por nombre o apellido...">
                    <button class="btn btn-outline-secondary" type="button" onclick="buscarEmpleados()">
                        <i class="bi bi-search"></i> Buscar
                    </button>
                    <button class="btn btn-outline-secondary" type="button" onclick="cargarEmpleados()">
                        <i class="bi bi-arrow-clockwise"></i> Todos
                    </button>
                </div>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-success" onclick="abrirModalNuevo()">
                    <i class="bi bi-plus-circle"></i> Nuevo Empleado
                </button>
            </div>
        </div>

        <!-- Filtros adicionales -->
        <div class="row mb-3">
            <div class="col-md-4">
                <select class="form-select" id="filtroDepartamento" onchange="filtrarPorDepartamento()">
                    <option value="">Todos los Departamentos</option>
                </select>
            </div>
            <div class="col-md-4">
                <select class="form-select" id="filtroCargo" onchange="filtrarPorCargo()">
                    <option value="">Todos los Cargos</option>
                </select>
            </div>
        </div>

        <!-- Tabla de empleados -->
        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Cargo</th>
                                <th>Departamento</th>
                                <th>Salario</th>
                                <th>Fecha Ingreso</th>
                                <th>Email</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tablaEmpleados">
                            <tr>
                                <td colspan="9" class="text-center">
                                    <div class="spinner-border text-primary" role="status">
                                        <span class="visually-hidden">Cargando...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para Crear/Editar Empleado -->
    <div class="modal fade" id="modalEmpleado" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Nuevo Empleado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEmpleado">
                        <input type="hidden" id="empleadoId">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="nombre" class="form-label">Nombre *</label>
                                <input type="text" class="form-control" id="nombre" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="apellido" class="form-label">Apellido *</label>
                                <input type="text" class="form-control" id="apellido" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="cargo" class="form-label">Cargo *</label>
                                <input type="text" class="form-control" id="cargo" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="departamento" class="form-label">Departamento *</label>
                                <input type="text" class="form-control" id="departamento" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="salario" class="form-label">Salario *</label>
                                <input type="number" class="form-control" id="salario" step="0.01" min="0" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="fechaIngreso" class="form-label">Fecha de Ingreso *</label>
                                <input type="date" class="form-control" id="fechaIngreso" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email *</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarEmpleado()">
                        <i class="bi bi-save"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de confirmación para eliminar -->
    <div class="modal fade" id="modalEliminar" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title">Confirmar Eliminación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>¿Está seguro de que desea eliminar este empleado?</p>
                    <p class="text-muted">Esta acción no se puede deshacer.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" onclick="confirmarEliminar()">
                        <i class="bi bi-trash"></i> Eliminar
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = '/api/empleados';
        let empleadoEliminarId = null;
        let modalEmpleado = null;
        let modalEliminar = null;

        document.addEventListener('DOMContentLoaded', function() {
            modalEmpleado = new bootstrap.Modal(document.getElementById('modalEmpleado'));
            modalEliminar = new bootstrap.Modal(document.getElementById('modalEliminar'));
            cargarEmpleados();
        });

        function mostrarAlerta(mensaje, tipo = 'success') {
            const alertContainer = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${tipo} alert-dismissible fade show`;
            alert.innerHTML = `
                ${mensaje}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.appendChild(alert);

            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        async function cargarEmpleados() {
            try {
                const response = await fetch(API_URL);
                const empleados = await response.json();
                mostrarEmpleados(empleados);
                cargarFiltros(empleados);
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error al cargar empleados', 'danger');
            }
        }

        function mostrarEmpleados(empleados) {
            const tbody = document.getElementById('tablaEmpleados');

            if (empleados.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center">No hay empleados registrados</td></tr>';
                return;
            }

            tbody.innerHTML = empleados.map(emp => `
                <tr>
                    <td>${emp.id}</td>
                    <td>${emp.nombre}</td>
                    <td>${emp.apellido}</td>
                    <td>${emp.cargo}</td>
                    <td><span class="badge bg-info">${emp.departamento}</span></td>
                    <td>$${parseFloat(emp.salario).toFixed(2)}</td>
                    <td>${emp.fechaIngreso}</td>
                    <td>${emp.email}</td>
                    <td>
                        <button class="btn btn-sm btn-warning" onclick="editarEmpleado(${emp.id})" title="Editar">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="abrirModalEliminar(${emp.id})" title="Eliminar">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        function cargarFiltros(empleados) {
            const departamentos = [...new Set(empleados.map(e => e.departamento))];
            const cargos = [...new Set(empleados.map(e => e.cargo))];

            const selectDepartamento = document.getElementById('filtroDepartamento');
            const selectCargo = document.getElementById('filtroCargo');

            selectDepartamento.innerHTML = '<option value="">Todos los Departamentos</option>' +
                departamentos.map(d => `<option value="${d}">${d}</option>`).join('');

            selectCargo.innerHTML = '<option value="">Todos los Cargos</option>' +
                cargos.map(c => `<option value="${c}">${c}</option>`).join('');
        }

        function abrirModalNuevo() {
            document.getElementById('modalTitle').textContent = 'Nuevo Empleado';
            document.getElementById('formEmpleado').reset();
            document.getElementById('empleadoId').value = '';
            modalEmpleado.show();
        }

        async function editarEmpleado(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                const empleado = await response.json();

                document.getElementById('modalTitle').textContent = 'Editar Empleado';
                document.getElementById('empleadoId').value = empleado.id;
                document.getElementById('nombre').value = empleado.nombre;
                document.getElementById('apellido').value = empleado.apellido;
                document.getElementById('cargo').value = empleado.cargo;
                document.getElementById('departamento').value = empleado.departamento;
                document.getElementById('salario').value = empleado.salario;
                document.getElementById('fechaIngreso').value = empleado.fechaIngreso;
                document.getElementById('email').value = empleado.email;

                modalEmpleado.show();
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error al cargar empleado', 'danger');
            }
        }

        async function guardarEmpleado() {
            const id = document.getElementById('empleadoId').value;
            const empleado = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                cargo: document.getElementById('cargo').value,
                departamento: document.getElementById('departamento').value,
                salario: parseFloat(document.getElementById('salario').value),
                fechaIngreso: document.getElementById('fechaIngreso').value,
                email: document.getElementById('email').value
            };

            try {
                const url = id ? `${API_URL}/${id}` : API_URL;
                const method = id ? 'PUT' : 'POST';

                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(empleado)
                });

                if (response.ok) {
                    modalEmpleado.hide();
                    cargarEmpleados();
                    mostrarAlerta(id ? 'Empleado actualizado exitosamente' : 'Empleado creado exitosamente', 'success');
                } else {
                    const error = await response.json();
                    mostrarAlerta(error.error || 'Error al guardar empleado', 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error al guardar empleado', 'danger');
            }
        }

        function abrirModalEliminar(id) {
            empleadoEliminarId = id;
            modalEliminar.show();
        }

        async function confirmarEliminar() {
            try {
                const response = await fetch(`${API_URL}/${empleadoEliminarId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    modalEliminar.hide();
                    cargarEmpleados();
                    mostrarAlerta('Empleado eliminado exitosamente', 'success');
                } else {
                    mostrarAlerta('Error al eliminar empleado', 'danger');
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error al eliminar empleado', 'danger');
            }
        }

        async function buscarEmpleados() {
            const busqueda = document.getElementById('searchInput').value.trim();

            if (!busqueda) {
                cargarEmpleados();
                return;
            }

            try {
                const response = await fetch(`${API_URL}/buscar?q=${encodeURIComponent(busqueda)}`);
                const empleados = await response.json();
                mostrarEmpleados(empleados);
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error al buscar empleados', 'danger');
            }
        }

        async function filtrarPorDepartamento() {
            const departamento = document.getElementById('filtroDepartamento').value;

            if (!departamento) {
                cargarEmpleados();
                return;
            }

            try {
                const response = await fetch(`${API_URL}/departamento/${encodeURIComponent(departamento)}`);
                const empleados = await response.json();
                mostrarEmpleados(empleados);
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error al filtrar por departamento', 'danger');
            }
        }

        async function filtrarPorCargo() {
            const cargo = document.getElementById('filtroCargo').value;

            if (!cargo) {
                cargarEmpleados();
                return;
            }

            try {
                const response = await fetch(`${API_URL}/cargo/${encodeURIComponent(cargo)}`);
                const empleados = await response.json();
                mostrarEmpleados(empleados);
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error al filtrar por cargo', 'danger');
            }
        }

        // Buscar al presionar Enter
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                buscarEmpleados();
            }
        });
    </script>
</body>
</html>
