version: '3.8'

services:
  # Servicio de PostgreSQL
  postgres-db:
    image: postgres:16-alpine
    container_name: empleados-postgres
    environment:
      POSTGRES_DB: empleados_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - empleados-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d empleados_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio de la aplicación Spring Boot
  empleado-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: empleados-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/empleados_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - empleados-network
    restart: on-failure

volumes:
  postgres-data:
    driver: local

networks:
  empleados-network:
    driver: bridge
